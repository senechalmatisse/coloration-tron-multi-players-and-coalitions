# Diplomatie tactique (P03) : alliances souples qui modifient seulement les
# preferences sociales (matrice W) des agents qui les exploitent. Les equipes
# permanentes ci-dessous et la condition de victoire ne changent pas.
# free_action: true rend explicite l'hypothese de la V1 (une action
# diplomatique ne coute pas de demi-coup).
name: diplomacy_example
grid: 20
seed: 42
placement: {mode: regular, rotate: true}
heuristic: {name: voronoi, tie: order}
diplomacy:
  enabled: true
  proposal_ttl_plies: 8
  max_allies_per_player: 2
  alliance_weight: 0.65
  betrayal_penalty: 0.15
  break_cooldown_plies: 4
  free_action: true
players:
  - {name: solo, team: solo, agent: paranoid, depth: 5}
  - {name: c1, team: coalition, agent: social, depth: 3, profile: dynamic_team}
  - {name: c2, team: coalition, agent: social, depth: 3, profile: dynamic_team}
  - {name: outsider, team: outsider, agent: social, depth: 2, profile: dynamic_team}
